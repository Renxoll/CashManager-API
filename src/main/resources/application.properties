spring.application.name=cash

# Postgres/Redis se resuelven solos via spring-boot-docker-compose (compose.yaml) en dev;
# en Azure se inyectan por variables de entorno estandar de Spring Boot (SPRING_DATASOURCE_URL, etc).
spring.flyway.locations=classpath:db/migration

# Proveedor de LLM (dialecto OpenAI Chat Completions; Gemini Flash funciona igual en su
# endpoint OpenAI-compatible, solo cambia base-url/model).
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.timeout=8s
app.llm.max-retries=2

app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.credentials-path=${FCM_CREDENTIALS_PATH:/secrets/firebase-service-account.json}

# Segundo factor (además del Bearer normal) para /api/v1/transactions/retry-failed: pensado
# para que lo llame un cron/proceso interno, no un usuario de la app. Cambiar en producción.
app.internal.retry-token=${INTERNAL_RETRY_TOKEN:dev-only-retry-token-cambiar-en-produccion}

# Secreto HMAC que firma los access tokens de IAM. El default solo sirve para dev/local:
# en cualquier despliegue real DEBE venir de IAM_TOKEN_SECRET (Key Vault / Secrets Manager
# de Azure), nunca quedar hardcodeado en el repo.
iam.token.secret=${IAM_TOKEN_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
iam.token.expiration-minutes=15
iam.refresh-token.expiration-days=7

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

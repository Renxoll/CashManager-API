spring.application.name=cash

# Postgres/Redis se resuelven solos via spring-boot-docker-compose (compose.yaml) en dev;
# en Azure se inyectan por variables de entorno estandar de Spring Boot (SPRING_DATASOURCE_URL, etc).
spring.flyway.locations=classpath:db/migration

# Proveedor de LLM (dialecto OpenAI Chat Completions; Gemini Flash funciona igual en su
# endpoint OpenAI-compatible, solo cambia base-url/model).
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
# Timeout de la EXTRACCION de transacciones (OpenAiTransactionExtractionAdapter): corre en
# el worker async de TransactionReceived, con reintentos propios (app.llm.max-retries), asi
# que la meta aca es fallar rapido y reintentar, no esperar a un modelo lento.
app.llm.timeout=${LLM_TIMEOUT:8s}
app.llm.max-retries=2

# Timeout del ASESOR financiero (GeminiFinancialAdvisorAdapter, via AdvisorLlmClientConfig).
# Aparte del de arriba a proposito: el chat usa modelos con razonamiento (p. ej.
# gemini-3.x-flash) que sin streaming tardan 10-30s en responder, muy por encima de los 8s
# de la extraccion -- y subir app.llm.timeout arrastraria tambien los reintentos del worker
# de ingesta. Mismo namespace de credenciales (app.llm.base-url / app.llm.api-key), solo
# cambia cuanto se espera.
app.advisor.llm.timeout=${ADVISOR_LLM_TIMEOUT:45s}

# Proveedor de respaldo (xAI Grok, mismo dialecto): entra en juego cuando el proveedor
# primario de app.llm.* falla, tanto para el asesor (FallbackAdvisorChatClient) como para
# la extracción de transacciones (FallbackTransactionExtractionService) -- el mismo límite
# diario de Gemini free-tier afecta a los dos.
app.llm.fallback.base-url=${XAI_BASE_URL:https://api.x.ai/v1}
app.llm.fallback.api-key=${XAI_API_KEY:}
app.llm.fallback.model=${XAI_MODEL:grok-4.6}
app.llm.fallback.timeout=${XAI_TIMEOUT:45s}

app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.credentials-path=${FCM_CREDENTIALS_PATH:/secrets/firebase-service-account.json}

# Stripe Checkout para el plan PREMIUM. premium-price-id es el id del Price recurrente
# creado en el dashboard de Stripe (Product catalog), no un monto suelto -- Checkout en modo
# "subscription" siempre referencia un Price existente. success/cancel-url son adonde Stripe
# redirige al usuario de vuelta tras pagar o abandonar el checkout (deben vivir en el
# frontend, no en este backend).
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
stripe.success-url=${STRIPE_SUCCESS_URL:https://app.smartcash.pe/subscription/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:https://app.smartcash.pe/subscription/cancel}

# Segundo factor (además del Bearer normal) para /api/v1/transactions/retry-failed: pensado
# para que lo llame un cron/proceso interno, no un usuario de la app. Cambiar en producción.
app.internal.retry-token=${INTERNAL_RETRY_TOKEN:dev-only-retry-token-cambiar-en-produccion}

# Secreto HMAC que firma los access tokens de IAM. El default solo sirve para dev/local:
# en cualquier despliegue real DEBE venir de IAM_TOKEN_SECRET (Key Vault / Secrets Manager
# de Azure), nunca quedar hardcodeado en el repo.
iam.token.secret=${IAM_TOKEN_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
iam.token.expiration-minutes=15
iam.refresh-token.expiration-days=7

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Observabilidad (Sentry). Sin DSN el starter queda deshabilitado solo (no hace falta un
# flag propio ni condicionales): SENTRY_DSN vacío en dev/test es el comportamiento normal.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
# 1.0 = todas las transacciones van a Sentry Performance; bajar en producción con volumen
# real (p. ej. 0.2) para no consumir la cuota de eventos solo con tracing.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

# Rate limiting (Bucket4j + Redis) sobre los endpoints más costosos: ingestión de
# transacciones (dispara al LLM) y el webhook de Stripe (público, sin Bearer).
app.rate-limit.capacity=15
app.rate-limit.window=PT1M

# Rate limiting por buzón destino (WebhookRateLimiterService + @RateLimitByToParam) para el
# webhook de SendGrid Inbound Parse: propiedades separadas de app.rate-limit.* de arriba
# porque este límite protege una identidad distinta (el "to" del correo, no IP/usuario) y
# puede necesitar ajustarse de forma independiente.
app.rate-limit.webhook.capacity=15
app.rate-limit.webhook.window=PT1M

# Registro de publicación de eventos de Spring Modulith (tabla event_publication): respalda
# el worker async de TransactionReceived -- si el proceso muere entre el commit y que el
# listener corra, el evento queda marcado como incompleto y disponible para reintento, en
# vez de perderse. La tabla se crea vía Flyway (V6__create_event_publication_table.sql),
# no acá: jdbc-schema-initialization=true nunca la creó en la práctica (relation
# "event_publication" does not exist -- 500 en cualquier flujo que publicara un evento,
# bug real encontrado corriendo el flujo de ingesta por correo end-to-end), probablemente
# por interacción con Flyway ya gestionando el schema. Se deja en false a propósito para
# no tener dos mecanismos compitiendo por crear la misma tabla.
spring.modulith.events.jdbc-schema-initialization.enabled=false

# Ingesta de transacciones por correo (SendGrid Inbound Parse). El dominio de las direcciones
# que se generan en el onboarding (alias-{hash}@dominio, ver UserProfile.register) -- debe
# coincidir con el MX/dominio configurado del lado de SendGrid como destino del parseo.
app.inbound-email.domain=${INBOUND_EMAIL_DOMAIN:inbox.smartcash.pe}
# Secreto en la URL del webhook (SendGrid Inbound Parse no soporta headers custom, solo se
# configura la URL de destino): https://.../api/v1/transactions/inbound?token=ESTO
app.inbound-email.token=${INBOUND_EMAIL_TOKEN:dev-only-inbound-token-cambiar-en-produccion}
# Allowlist de dominios de remitente que TrustedBankSenderPolicy acepta como banca real;
# cualquier otro remitente (spam, reenvíos mal dirigidos) se descarta en silencio. Ajustar
# con los dominios reales de notificación de cada banco soportado. GmailPollingJob reusa
# esta misma lista para construir su búsqueda en Gmail -- una sola fuente de verdad para
# "qué remitentes son banca real", sin importar si el correo llega reenviado o se lee
# directo de la bandeja.
app.inbound-email.trusted-sender-domains=${INBOUND_EMAIL_TRUSTED_DOMAINS:bcp.com.pe,notificaciones.interbank.pe,bbva.pe,netinterbank.com.pe,yape.pe}

# Ingesta de transacciones leyendo la bandeja de Gmail del usuario directamente (OAuth2),
# alternativa a reenviar correos a mano. Client ID/Secret salen de un proyecto en Google
# Cloud Console con la Gmail API habilitada y el scope gmail.readonly (ver GmailOAuthController
# / GoogleOAuthPortAdapter). El redirect-uri debe estar registrado tal cual en "Authorized
# redirect URIs" del cliente OAuth, y su dominio (api.tuluki.com) en "Authorized domains" de
# la pantalla de consentimiento -- con la app ya verificada, el refresh token deja de
# expirar cada 7 días (comportamiento del modo Testing).
app.google-oauth.client-id=${GOOGLE_CLIENT_ID:}
app.google-oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google-oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:https://api.tuluki.com/api/v1/gmail/oauth/callback}
# openid+email: para poder mostrarle al usuario qué correo real tiene conectado en el panel
# de cuentas (Google no lo devuelve con gmail.readonly solo) -- scopes "no sensibles" según
# la clasificación de Google, no requieren re-verificación de la app en Google Cloud Console.
app.google-oauth.scope=https://www.googleapis.com/auth/gmail.readonly openid email

# Cifrado en reposo (AES-256-GCM) de los tokens OAuth de Gmail -- 32 bytes en base64. El
# default es SOLO para dev/local; en cualquier despliegue real DEBE venir de
# GMAIL_TOKEN_ENCRYPTION_KEY (Key Vault / Secrets Manager), nunca quedar hardcodeado.
# Generar uno nuevo con: python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
app.gmail-sync.token-encryption-key=${GMAIL_TOKEN_ENCRYPTION_KEY:ru2k+yX+EFj4iuVgN5I7E04LQTgqrC9iClpteRjRJkY=}
# Cada cuánto corre GmailPollingJob por todas las conexiones activas.
app.gmail-sync.poll-interval-ms=${GMAIL_SYNC_POLL_INTERVAL_MS:300000}
# Adonde redirige el navegador el callback de Google (nunca a un cliente HTTP -- es una
# navegación real, ver GmailOAuthController.callback).
app.gmail-sync.success-redirect-url=${GMAIL_SYNC_SUCCESS_URL:https://tuluki.com/dashboard?gmail=connected}
app.gmail-sync.error-redirect-url=${GMAIL_SYNC_ERROR_URL:https://tuluki.com/dashboard?gmail=error}

spring.application.name=cash

# Postgres/Redis se resuelven solos via spring-boot-docker-compose (compose.yaml) en dev;
# en Azure se inyectan por variables de entorno estandar de Spring Boot (SPRING_DATASOURCE_URL, etc).
spring.flyway.locations=classpath:db/migration

# Proveedor de LLM (dialecto OpenAI Chat Completions; Gemini Flash funciona igual en su
# endpoint OpenAI-compatible, solo cambia base-url/model).
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.timeout=8s
app.llm.max-retries=2

app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.credentials-path=${FCM_CREDENTIALS_PATH:/secrets/firebase-service-account.json}

# Stripe Checkout para el plan PREMIUM. premium-price-id es el id del Price recurrente
# creado en el dashboard de Stripe (Product catalog), no un monto suelto -- Checkout en modo
# "subscription" siempre referencia un Price existente. success/cancel-url son adonde Stripe
# redirige al usuario de vuelta tras pagar o abandonar el checkout (deben vivir en el
# frontend, no en este backend).
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
stripe.success-url=${STRIPE_SUCCESS_URL:https://app.smartcash.pe/subscription/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:https://app.smartcash.pe/subscription/cancel}

# Segundo factor (además del Bearer normal) para /api/v1/transactions/retry-failed: pensado
# para que lo llame un cron/proceso interno, no un usuario de la app. Cambiar en producción.
app.internal.retry-token=${INTERNAL_RETRY_TOKEN:dev-only-retry-token-cambiar-en-produccion}

# Secreto HMAC que firma los access tokens de IAM. El default solo sirve para dev/local:
# en cualquier despliegue real DEBE venir de IAM_TOKEN_SECRET (Key Vault / Secrets Manager
# de Azure), nunca quedar hardcodeado en el repo.
iam.token.secret=${IAM_TOKEN_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
iam.token.expiration-minutes=15
iam.refresh-token.expiration-days=7

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Observabilidad (Sentry). Sin DSN el starter queda deshabilitado solo (no hace falta un
# flag propio ni condicionales): SENTRY_DSN vacío en dev/test es el comportamiento normal.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
# 1.0 = todas las transacciones van a Sentry Performance; bajar en producción con volumen
# real (p. ej. 0.2) para no consumir la cuota de eventos solo con tracing.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

# Rate limiting (Bucket4j + Redis) sobre los endpoints más costosos: ingestión de
# transacciones (dispara al LLM) y el webhook de Stripe (público, sin Bearer).
app.rate-limit.capacity=15
app.rate-limit.window=PT1M

# Rate limiting por buzón destino (WebhookRateLimiterService + @RateLimitByToParam) para el
# webhook de SendGrid Inbound Parse: propiedades separadas de app.rate-limit.* de arriba
# porque este límite protege una identidad distinta (el "to" del correo, no IP/usuario) y
# puede necesitar ajustarse de forma independiente.
app.rate-limit.webhook.capacity=15
app.rate-limit.webhook.window=PT1M

# Registro de publicación de eventos de Spring Modulith (tabla event_publication): respalda
# el worker async de TransactionReceived -- si el proceso muere entre el commit y que el
# listener corra, el evento queda marcado como incompleto y disponible para reintento, en
# vez de perderse. jdbc-schema-initialization crea esa tabla sola al arrancar (separado de
# las migraciones de Flyway en db/migration, que son del esquema de negocio).
spring.modulith.events.jdbc-schema-initialization.enabled=true

# Ingesta de transacciones por correo (SendGrid Inbound Parse). El dominio de las direcciones
# que se generan en el onboarding (alias-{hash}@dominio, ver UserProfile.register) -- debe
# coincidir con el MX/dominio configurado del lado de SendGrid como destino del parseo.
app.inbound-email.domain=${INBOUND_EMAIL_DOMAIN:inbox.smartcash.pe}
# Secreto en la URL del webhook (SendGrid Inbound Parse no soporta headers custom, solo se
# configura la URL de destino): https://.../api/v1/transactions/inbound?token=ESTO
app.inbound-email.token=${INBOUND_EMAIL_TOKEN:dev-only-inbound-token-cambiar-en-produccion}
# Allowlist de dominios de remitente que TrustedBankSenderPolicy acepta como banca real;
# cualquier otro remitente (spam, reenvíos mal dirigidos) se descarta en silencio. Ajustar
# con los dominios reales de notificación de cada banco soportado.
app.inbound-email.trusted-sender-domains=${INBOUND_EMAIL_TRUSTED_DOMAINS:bcp.com.pe,notificaciones.interbank.pe,bbva.pe}

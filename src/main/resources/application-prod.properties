# Solo para --spring.profiles.active=prod (Render, Azure, etc). Nunca toca el perfil por
# defecto: en dev, spring-boot-docker-compose sigue resolviendo Postgres/Redis solo a partir
# de compose.yaml, sin que esta URL entre en juego.
#
# Postgres vive en Supabase. Supabase expone la BD como una connection URI estilo libpq
# (postgresql://user:pass@host:port/db), pero el driver JDBC de PostgreSQL NO parsea
# credenciales embebidas en la URL -- solo entiende user/password como parametros separados.
# Por eso se arma la URL JDBC a partir de host/port/nombre de BD sueltos, y las credenciales
# viajan aparte en spring.datasource.username/password (bindeadas automaticamente desde
# SPRING_DATASOURCE_USERNAME/PASSWORD por Spring Boot).
#
# DB_HOST tiene que ser el pooler de Supabase en modo "Session" (aws-0-<region>.pooler.supabase.com,
# puerto 5432), no la conexion directa db.<ref>.supabase.co: la directa es solo IPv6 y Render no
# sale por IPv6. El modo Session (a diferencia de Transaction, puerto 6543) mantiene la
# conexion fisica por cliente, asi que prepared statements y los locks de Flyway funcionan
# igual que contra un Postgres normal. Con el pooler el usuario es postgres.<project-ref>.
# Supabase exige TLS, de ahi sslmode=require.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
# El pooler Session del plan free de Supabase acepta pocas conexiones por proyecto (~15); el
# default de Hikari (10) mas un redeploy solapado con la instancia vieja lo agota.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Redis SI soporta credenciales embebidas en su connection URI (Lettuce las parsea
# nativamente), asi que aca si alcanza con una sola variable -- tipicamente la que entrega
# Upstash o el "Key Value" nativo de Render tal cual, sin necesidad de desarmarla.
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

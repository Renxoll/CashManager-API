# Solo para --spring.profiles.active=prod (Render, Azure, etc). Nunca toca el perfil por
# defecto: en dev, spring-boot-docker-compose sigue resolviendo Postgres/Redis solo a partir
# de compose.yaml, sin que esta URL entre en juego.
#
# Render (y la mayoria de proveedores gestionados) expone Postgres como una connection URI
# estilo libpq (postgresql://user:pass@host:port/db), pero el driver JDBC de PostgreSQL NO
# parsea credenciales embebidas en la URL -- solo entiende user/password como parametros
# separados. Por eso NO se usa la connection string completa directo: se arma la URL JDBC a
# partir de host/port/nombre de BD sueltos (ver render.yaml, fromDatabase con property: host
# / port / database), y las credenciales viajan aparte en spring.datasource.username/password
# (bindeadas automaticamente desde SPRING_DATASOURCE_USERNAME/PASSWORD por Spring Boot).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Redis SI soporta credenciales embebidas en su connection URI (Lettuce las parsea
# nativamente), asi que aca si alcanza con una sola variable -- tipicamente la que entrega
# Upstash o el "Key Value" nativo de Render tal cual, sin necesidad de desarmarla.
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

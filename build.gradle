plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.hibernate.orm' version '7.4.1.Final'
  id 'org.graalvm.buildtools.native' version '1.1.1'
}

group = 'pe.smartcash'
version = '0.0.1-SNAPSHOT'
description = 'cash'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

ext {
  set('springModulithVersion', "2.1.0")
  set('bucket4jVersion', "8.10.1")
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
  implementation 'org.springframework.modulith:spring-modulith-starter-core'
  implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-database-postgresql'
  implementation 'com.google.firebase:firebase-admin:9.4.1'
  implementation 'com.stripe:stripe-java:33.3.0'
  // Observabilidad: captura de excepciones no controladas + fallos de LLM/Stripe (ver
  // GlobalExceptionHandler, StripeWebhookController, OpenAiTransactionExtractionAdapter).
  // SDK base, NO el starter (sentry-spring-boot-starter-jakarta): a la fecha, ese starter
  // solo declara compatibilidad con Spring Boot 3.x -- su auto-configuración referencia
  // clases que Boot 4.1 reubicó (p. ej. RestClientCustomizer) y rompe el arranque. Se
  // inicializa a mano en SentryConfig, sin depender de esa auto-configuración.
  implementation 'io.sentry:sentry:8.16.0'
  // Rate limiting distribuido: el mismo Redis que ya usa el cache de comercios y la
  // blacklist de tokens, así que no se suma infraestructura nueva, solo un uso más.
  // (com.bucket4j no publica bucket4j-bom pese al nombre, así que ambos módulos se fijan
  // a la misma versión a mano.)
  implementation "com.bucket4j:bucket4j-core:${bucket4jVersion}"
  implementation "com.bucket4j:bucket4j-redis:${bucket4jVersion}"
  compileOnly 'org.projectlombok:lombok'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
  runtimeOnly 'org.postgresql:postgresql'
  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testCompileOnly 'org.projectlombok:lombok'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
  }
}

hibernate {
  enhancement {
  }
}

tasks.named('test') {
  useJUnitPlatform()
}

# Blueprint de Render para SmartCash. Al conectar este repo en el dashboard, Render lee este
# archivo y crea/actualiza el web service declarado aca.
#
# Postgres NO vive en Render sino en Supabase (plan free; el Postgres "free" de Render expira a
# los 90 dias y el "starter" es pago). Las credenciales se cargan a mano en el dashboard
# (sync:false). NO se usa la connection string completa como SPRING_DATASOURCE_URL: el driver
# JDBC de PostgreSQL no parsea credenciales embebidas en la URL, asi que se pasan
# host/port/database/user/password sueltos y la URL JDBC real se arma en
# application-prod.properties (jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}).

services:
  - type: web
    name: smartcash-backend
    env: docker
    region: oregon
    plan: free # sujeto a cold start tras 15 min de inactividad; ver /api/v1/system/ping para el keep-alive
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Postgres (Supabase): usar el pooler en modo Session, no la conexion directa (solo
      # IPv6, Render no llega). Valores de Project Settings > Database > Connection string > Session pooler:
      #   DB_HOST = aws-0-<region>.pooler.supabase.com   DB_PORT = 5432   DB_NAME = postgres
      #   SPRING_DATASOURCE_USERNAME = postgres.<project-ref>
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # --- Redis: a diferencia de JDBC, Lettuce sí parsea credenciales embebidas en la URI,
      # así que acá alcanza con una sola variable. sync:false porque Render no tiene un
      # recurso Redis propio en este blueprint (usar Upstash u otro proveedor externo: pegar
      # la URL completa, ej. rediss://default:<password>@<host>:<port>, en el dashboard).
      - key: SPRING_DATA_REDIS_URL
        sync: false

      # --- Secretos de aplicación: nunca en texto plano en el YAML, se piden en el dashboard ---
      - key: IAM_TOKEN_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false

      # --- OAuth de Google: el redirect debe apuntar al dominio propio (api.tuluki.com),
      # registrado igual en "Authorized redirect URIs" del cliente OAuth. Client ID/Secret
      # son secretos y se cargan en el dashboard. ---
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://api.tuluki.com/api/v1/gmail/oauth/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Culqi: pasarela de pago del contexto subscription (ver CulqiPaymentGatewayAdapter +
      # CulqiWebhookController). Sin la llave y el plan, cualquier pago PREMIUM en prod responde
      # 502 (PaymentGatewayException). En producción, CULQI_SECRET_KEY tiene que ser la llave
      # sk_live_ del CulqiPanel (Desarrollo > API Keys) y CULQI_PREMIUM_PLAN_ID el plan pln_live_
      # creado en el panel en modo producción. CULQI_WEBHOOK_TOKEN es un secreto aleatorio que
      # también va en la URL del webhook registrada en el panel (Eventos > Webhooks):
      # https://api.tuluki.com/api/v1/subscriptions/culqi-webhook?token=<CULQI_WEBHOOK_TOKEN>
      - key: CULQI_SECRET_KEY
        sync: false
      - key: CULQI_PREMIUM_PLAN_ID
        sync: false
      - key: CULQI_WEBHOOK_TOKEN
        sync: false

      # --- Envío de correo (SendGrid Web API v3): hoy solo el correo de "restablecer
      # contraseña" de IAM. Con SENDGRID_ENABLED=false el backend levanta igual pero no
      # manda nada (loguea el enlace) -- en prod tiene que ser "true" + una API key con
      # permiso "Mail Send" y un remitente verificado. PASSWORD_RESET_LINK_BASE_URL es la
      # vista del frontend que recibe el ?token= (no un endpoint de este backend).
      - key: SENDGRID_ENABLED
        value: "true"
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_LINK_BASE_URL
        value: https://www.tuluki.com/reset-password

      - key: FCM_ENABLED
        value: "false"
